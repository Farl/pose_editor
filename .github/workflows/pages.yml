name: Deploy static site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build runtime config
        shell: bash
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          POLLINATIONS_API_BASE_URL: ${{ vars.POLLINATIONS_API_BASE_URL }}
          POLLINATIONS_IMAGE_MODEL: ${{ vars.POLLINATIONS_IMAGE_MODEL }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
        run: |
          cat > config.runtime.js <<EOF
          window.POSE_EDITOR_CONFIG = {
            AI_PROVIDER: "${AI_PROVIDER:-pollinations}",
            POLLINATIONS_API_BASE_URL: "${POLLINATIONS_API_BASE_URL:-https://gen.pollinations.ai}",
            POLLINATIONS_API_KEY: "${POLLINATIONS_API_KEY}",
            POLLINATIONS_IMAGE_MODEL: "${POLLINATIONS_IMAGE_MODEL:-kontext}",
            GITHUB_TOKEN: "${GITHUB_TOKEN}",
          };
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4