<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pose Editor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
  />
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script>
</head>
<body>
  <!--
    App shell: toolbar across the top, canvas workspace, properties panel on the
    right (below the canvas on narrow screens). Icon buttons carry their name
    and shortcut in data-tip / aria-label; sidebar.js fills in the shortcut.
  -->
  <div id="app" class="app">
    <header class="toolbar">
      <div class="wordmark">Pose Editor</div>

      <div class="tool-group">
        <button id="undoBtn" class="icon-btn" data-action="undo" disabled>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3.5 2.5 6.5l3 3" /><path d="M2.5 6.5h7a4 4 0 0 1 0 8h-3" /></svg>
        </button>
        <button id="redoBtn" class="icon-btn" data-action="redo" disabled>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m10.5 3.5 3 3-3 3" /><path d="M13.5 6.5h-7a4 4 0 0 0 0 8h3" /></svg>
        </button>
        <button id="resetBtn" class="icon-btn" data-action="reset">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8a5.5 5.5 0 1 0 1.6-3.9" /><path d="M2.5 2.5v3h3" /></svg>
        </button>
      </div>

      <div class="segmented" role="group" aria-label="Editor mode">
        <button id="mode2dBtn" class="segmented-btn" aria-pressed="true">2D</button>
        <button id="mode3dBtn" class="segmented-btn" aria-pressed="false">3D</button>
      </div>
      <div id="dragModeGroup" class="segmented" role="group" aria-label="Drag mode"></div>

      <div id="transform3dGroup" class="segmented" role="group" aria-label="3D transform" hidden>
        <button id="move3dBtn" class="segmented-btn" aria-pressed="true">Move</button>
        <button id="rotate3dBtn" class="segmented-btn" aria-pressed="false">Rotate</button>
      </div>
      <div class="tool-group tool-group-end">
        <button class="icon-btn shortcuts-btn" popovertarget="shortcutsPanel" data-tip="Shortcuts" aria-label="Shortcuts">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="4" width="13" height="8.5" rx="1.5" /><path d="M4 7h1M7 7h2M11 7h1M5 10h6" /></svg>
        </button>
        <button id="downloadBtn" class="btn btn-primary">Export PNG</button>
      </div>
    </header>

    <main class="workspace">
      <!-- The stage holds the 2D canvas layers and is panned / zoomed on screen
           (canvasViewport.js); the frame clips it. The 3D view sits beside the
           stage and has its own orbit camera. -->
      <div id="canvasFrame" class="canvas-frame">
        <div id="canvasStage" class="canvas-stage">
          <canvas id="poseCanvas"></canvas>
        </div>
        <div id="scene3d" hidden></div>
      </div>
    </main>

    <aside class="panel">
      <details id="controls3dPanel" class="panel-section" hidden>
        <summary class="panel-title">3D pose</summary>

        <select id="preset3dSelect" class="field" aria-label="3D preset" hidden></select>
        <button id="finger3dBtn" class="btn" aria-pressed="false" hidden>Finger joints</button>
        <button id="reset3dBtn" class="btn" hidden>Reset 3D</button>
        <button id="state3dBtn" class="btn" hidden>Export 3D state</button>
        <button id="depth3dBtn" class="btn" hidden>Export depth</button>
      </details>
      <section id="pose2dPanel" class="panel-section">
        <h2 class="panel-title">Pose</h2>
        <select id="presetSelect" class="field" aria-label="Preset pose"></select>
        <select id="handPoseSelect" class="field" aria-label="Hand pose"></select>
        <button id="mirrorBtn" class="btn" data-action="mirror">Mirror</button>
        <div class="btn-pair">
          <button id="copyLeftBtn" class="btn">Copy L to R</button>
          <button id="copyRightBtn" class="btn">Copy R to L</button>
        </div>
        <button id="unpinAllBtn" class="btn btn-pin" hidden>Unpin all</button>
      </section>

      <section class="panel-section">
        <h2 class="panel-title">Display</h2>
        <select id="styleSelect" class="field" aria-label="Style"></select>
        <div class="field-row">
          <span id="handDetailLabel">Hands</span>
          <div id="handDetailGroup" class="segmented" role="group" aria-labelledby="handDetailLabel"></div>
        </div>
        <label id="fov3dRow" class="slider-row" hidden>
          <span>Field of view</span><input id="fov3dInput" type="range" /><output for="fov3dInput"></output>
        </label>
        <label class="slider-row">
          <span>Joints</span>
          <input id="jointSizeInput" type="range" min="2" max="16" step="1" />
          <output for="jointSizeInput"></output>
        </label>
        <label class="slider-row">
          <span>Links</span>
          <input id="linkScaleInput" type="range" min="0.5" max="3" step="0.1" />
          <output for="linkScaleInput"></output>
        </label>
      </section>

      <!-- Depth and camera (poseView.js). Collapsed unless a setting is in use;
           sidebar.js fills in the camera options and the sliders. -->
      <details id="viewPanel" class="panel-section panel-details">
        <summary class="panel-title">Depth and camera</summary>
        <select id="cameraSelect" class="field" aria-label="Camera"></select>
        <div id="viewSliders" class="view-sliders"></div>
        <button id="resetViewBtn" class="btn">Reset depth and camera</button>
      </details>

      <section class="panel-section">
        <h2 class="panel-title">AI render</h2>
        <label id="imageDrop" class="drop-zone">
          <input id="imageInput" type="file" accept="image/*" />
          <img id="inputImagePreview" alt="Reference image" hidden />
          <span class="drop-zone-empty">Add reference image</span>
        </label>
        <div class="key-row">
          <input
            id="apiKeyInput"
            class="field"
            type="password"
            placeholder="Pollinations API key"
            aria-label="Pollinations API key"
            autocomplete="off"
            spellcheck="false"
          />
          <a id="apiKeyLink" class="btn" target="_blank" rel="noopener">Get key</a>
        </div>
        <select id="imageModelSelect" class="field" aria-label="Image model"></select>
        <label class="check-row">
          <input id="allowPaidModels" type="checkbox" /> Include paid models
        </label>
        <button id="generateImageBtn" class="btn btn-primary" disabled>Apply pose</button>
        <div id="aiStatus" class="status" role="status"></div>
        <img id="resultImage" class="result-image" alt="Result" hidden />
      </section>
    </aside>

    <div id="shortcutsPanel" class="shortcuts-panel" popover>
      <h2 class="panel-title">Shortcuts</h2>
      <dl id="shortcutList" class="shortcut-list"></dl>
    </div>
  </div>

  <script src="./config.runtime.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
